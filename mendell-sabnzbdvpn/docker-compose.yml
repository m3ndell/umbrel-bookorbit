services:
  app_proxy:
    environment:
      APP_HOST: mendell-sabnzbdvpn_app_1
      APP_PORT: 8080

  app:
    image: ghcr.io/binhex/arch-sabnzbdvpn:5.1.3-1-02
    restart: on-failure
    # Required by the upstream image's WireGuard setup.
    privileged: true
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      VPN_ENABLED: "yes"
      VPN_PROV: custom
      VPN_CLIENT: wireguard
      ENABLE_PRIVOXY: "yes"
      ENABLE_SOCKS: "no"
      STRICT_PORT_FORWARD: "no"
      LAN_NETWORK: ${APP_MENDELL_SABNZBDVPN_LAN_NETWORK:-192.168.1.0/24}
      NAME_SERVERS: 1.1.1.1,1.0.0.1
      PUID: "1000"
      PGID: "1000"
      UMASK: "002"
      TZ: ${TZ:-Europe/Berlin}
    ports:
      # Bind only to loopback; proxying to Prowlarr uses Umbrel's host address.
      - "8118:8118"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/data
      - /etc/localtime:/etc/localtime:ro

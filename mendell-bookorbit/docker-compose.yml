version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mendell-bookorbit_app_1
      APP_PORT: 3000
      # BookOrbit authenticates its own users, including OPDS and e-reader clients.
      PROXY_AUTH_ADD: "false"

  permissions:
    image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    user: "0:0"
    restart: "no"
    # Only the package's own library roots, never recursively an existing NAS library.
    command: ["chown", "1000:1000", "/books", "/audiobooks"]
    volumes:
      - ${APP_DATA_DIR}/data/books:/books
      - ${APP_DATA_DIR}/data/audiobooks:/audiobooks

  app:
    image: ghcr.io/bookorbit/bookorbit:3.8.0@sha256:d318f7732f6f6330312e2c5f854f7899f858b54cc4b18a13cde1f43b5bea0515
    restart: on-failure
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3000
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-UTC}
      POSTGRES_HOST: mendell-bookorbit_db_1
      POSTGRES_PORT: 5432
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: bookorbit
      JWT_SECRET: ${APP_MENDELL_BOOKORBIT_JWT_SECRET}
      PODCAST_ENCRYPTION_KEY: ${APP_MENDELL_BOOKORBIT_PODCAST_KEY}
      EMAIL_ENCRYPTION_KEY: ${APP_MENDELL_BOOKORBIT_EMAIL_KEY}
      MIGRATION_ENCRYPTION_KEY: ${APP_MENDELL_BOOKORBIT_MIGRATION_KEY}
      BOOK_REQUEST_ENCRYPTION_KEY: ${APP_MENDELL_BOOKORBIT_REQUEST_KEY}
      SETUP_BOOTSTRAP_TOKEN: ${APP_PASSWORD}
      APP_URL: http://${DEVICE_DOMAIN_NAME}:8909
      # Both library mounts must be reachable in the folder picker.
      LIBRARY_BROWSE_ROOT: /
      NODE_MAX_OLD_SPACE_SIZE: auto
    volumes:
      - ${APP_DATA_DIR}/data/app:/data
      - ${APP_DATA_DIR}/data/books:/books
      - ${APP_DATA_DIR}/data/audiobooks:/audiobooks
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: bookorbit
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookorbit -d bookorbit"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

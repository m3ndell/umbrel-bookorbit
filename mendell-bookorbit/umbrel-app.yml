manifestVersion: 1
id: mendell-bookorbit
name: BookOrbit
tagline: Deine Bibliothek für E-Books, Comics und Hörbücher
category: media
version: "3.7.0"
port: 8909
description: >-
  BookOrbit verwaltet deine digitale Bibliothek mit Web-Reader, Metadaten,
  Lesefortschritt, OPDS, Kobo- und KOReader-Anbindung sowie mehreren Benutzern.


  Ersteinrichtung: Verwende das von Umbrel angezeigte App-Passwort als Setup-Token.
  Erstelle anschließend dein eigenes Administratorkonto mit einem eigenen Passwort.


  Lade Bücher im Web-Interface hoch oder wähle unter Einstellungen → Ordner einen
  vorhandenen Bücher- oder Hörbücherordner. Füge in BookOrbit /books für Bücher
  und /audiobooks für Hörbücher als Bibliothek hinzu.


  Für externe Geräte, Kobo, E-Mail-Links und OIDC muss APP_URL der tatsächlich
  verwendeten Serveradresse entsprechen. Sie kann unter Einstellungen → Umgebung
  angepasst werden. Ein vorhandener Big-Bear-Datenbestand wird nicht automatisch übernommen.
developer: BookOrbit
website: https://bookorbit.app
repo: https://github.com/bookorbit/bookorbit
support: https://github.com/m3ndell/umbrel-bookorbit/issues
submitter: m3ndell
submission: https://github.com/m3ndell/umbrel-bookorbit
icon: https://raw.githubusercontent.com/bookorbit/bookorbit/v3.7.0/docs/images/bookorbit-icon.png
gallery:
  - https://raw.githubusercontent.com/bookorbit/bookorbit/v3.7.0/docs/images/dashboard-overview.png
releaseNotes: >-
  Achtung: BookOrbit 3.7.0 entfernt die Podcast-Funktion. Beim ersten Start
  löscht die automatische Upstream-Datenbankmigration die Podcast-Tabellen
  einschließlich Podcast-Lesezeichen, Warteschlangen und Hörverlauf.
  Vor dem Update ein vollständiges Backup anlegen; ein Image-Downgrade
  stellt diese Daten nicht wieder her.


  Neu sind das Zusammenführen doppelter Bücher, verknüpfte E-Book- und
  Hörbuchausgaben, die gesammelte Bearbeitung des Lesestatus und
  rTorrent-Unterstützung. Zudem werden Metadaten, Kobo und KOReader verbessert.
  Die Mounts /books und /audiobooks bleiben erhalten.
  Vollständige Änderungen: https://github.com/bookorbit/bookorbit/releases/tag/v3.7.0
  Die optionalen separaten TTS- und Read-Aloud-Worker sind nicht enthalten.
dependencies: []
storage:
  dataRoot: data
folderAccess:
  - id: books
    name: Bücher
    note: Dein Bücherordner erscheint in BookOrbit als /books. BookOrbit benötigt Schreibrechte für UID/GID 1000.
    mounts:
      - service: app
        targetPath: /books
  - id: audiobooks
    name: Hörbücher
    note: Dein Hörbücherordner erscheint in BookOrbit als /audiobooks. BookOrbit benötigt Schreibrechte für UID/GID 1000.
    mounts:
      - service: app
        targetPath: /audiobooks
environment:
  - name: APP_URL
    services: [app]
    note: Vollständige erreichbare Serveradresse, z. B. https://books.example.com. Standard ist http://umbrel.local:8909.
  - name: TZ
    services: [app]
    note: Zeitzone, z. B. Europe/Berlin. Standard ist UTC.
path: ""
defaultUsername: ""
deterministicPassword: true
